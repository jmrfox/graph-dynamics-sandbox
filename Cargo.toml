[package]
name = "gds"
version = "0.1.0"
edition = "2024"

[dependencies]

# GUI
eframe = "0.33"
egui = "0.33"
egui_plot = "0.34"

# Graph structures
petgraph = "0.8"

# Math/vector utilities
glam = "0.30"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Random generation
rand = "0.9"

# Error handling
anyhow = "1"
